<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>🌸 健康生活记录</title>
<style>
:root{
  --bg:#fff5f7;--card:#fff;--text:#4a3040;--accent:#e0306c;--gold:#f0a030;
  --danger:#e0306c;--success:#4ade80;--info:#a855f7;--border:#f0dce4;--radius:14px;
  --period-actual:rgba(233,30,105,.15);--period-pred:rgba(233,30,105,.06);
  --ovu:rgba(168,85,247,.12);--fertile:rgba(168,85,247,.06)
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top)}
.app{max-width:480px;margin:0 auto;padding:0 0 90px}
header{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,var(--bg) 80%,transparent);padding:14px 16px 10px;
  text-align:center;backdrop-filter:blur(10px);padding-top:calc(14px + env(safe-area-inset-top))}
header h1{font-size:19px;background:linear-gradient(135deg,var(--accent),#f080a0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;letter-spacing:1px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--card);display:flex;border-top:1px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 2px;background:none;border:none;color:#bbb;font-size:10px;
  cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button .icon{font-size:19px;line-height:1}
nav button.active{color:var(--accent)}
nav button .badge{position:absolute;top:1px;right:calc(50% - 20px);background:var(--danger);color:#fff;
  font-size:9px;min-width:16px;height:16px;line-height:16px;border-radius:8px;text-align:center}
.panel{display:none;padding:12px 16px;animation:slideUp .3s ease}
.panel.active{display:block}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(200,160,180,.08)}
.card h3{font-size:14px;margin-bottom:10px;color:var(--accent);display:flex;align-items:center;gap:6px}
.btn{padding:9px 16px;border:none;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;
  transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:5px 12px;font-size:11px;border-radius:14px}
.btn-block{width:100%;margin-top:6px}
input,select,textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:12px;
  background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,48,108,.12)}
textarea{resize:vertical;min-height:60px}
label{display:block;margin-bottom:4px;font-size:12px;color:#b090a0;font-weight:500}
.form-group{margin-bottom:10px}
.form-row{display:flex;gap:8px}.form-row>*{flex:1}

/* 日历 */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-header button{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;
  padding:6px 10px;border-radius:8px;transition:.15s}
.cal-header button:active{background:var(--border)}
.cal-title{font-size:16px;font-weight:700;min-width:130px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:1px}
.cal-day-header{font-size:10px;color:#c0a0b0;padding:6px 0;font-weight:600}
.cal-day-header.weekend{color:var(--danger)}
.cal-day{padding:2px 1px;border-radius:6px;cursor:pointer;font-size:12px;min-height:46px;
  transition:.1s;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.cal-day:active{background:rgba(224,48,108,.10)}
.cal-day .solar-date{font-weight:500;margin-top:2px;width:22px;height:22px;line-height:22px;border-radius:50%}
.cal-day .lunar{font-size:9px;line-height:1.15;margin-top:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-day.empty{cursor:default}

/* 经期标记 */
.cal-day.period-actual{background:var(--period-actual)}
.cal-day.period-actual .solar-date{background:var(--danger);color:#fff;font-weight:700}
.cal-day.period-pred{background:var(--period-pred)}
.cal-day.period-pred .solar-date{border:1.5px dashed var(--danger);color:var(--danger)}
.cal-day.ovulation .solar-date{background:var(--info);color:#fff;font-weight:700}
.cal-day.fertile{background:var(--fertile)}
.cal-day.fertile .solar-date{color:var(--info)}

/* 今天 */
.cal-day.today{background:var(--accent) !important;color:#fff !important;font-weight:800 !important;
  box-shadow:0 0 0 4px rgba(224,48,108,.5),0 0 18px rgba(224,48,108,.35);transform:scale(1.06);z-index:10;
  animation:todayPulse 2s ease-in-out infinite;border-radius:10px}
.cal-day.today .solar-date{background:transparent !important;color:#fff !important;border:none !important}
.cal-day.today .lunar{color:rgba(255,255,255,.8) !important}
.cal-day.today .cal-marks span{color:rgba(255,255,255,.85) !important}

/* 节假日/生日 */
.cal-day.holiday .solar-date{color:var(--danger);font-weight:700}
.cal-day.birthday-day{background:rgba(240,160,48,.15)}
.cal-day.birthday-day .solar-date{color:var(--gold);font-weight:700}

/* 标记行 */
.cal-marks{display:flex;gap:1px;justify-content:center;margin-top:1px;flex-wrap:wrap;max-width:100%}
.cal-marks span{font-size:7px;line-height:1}

@keyframes todayPulse{0%,100%{box-shadow:0 0 0 4px rgba(224,48,108,.5),0 0 18px rgba(224,48,108,.35)}50%{box-shadow:0 0 0 7px rgba(224,48,108,.25),0 0 26px rgba(224,48,108,.5)}}

/* 详情卡片 */
.detail-card{padding:12px}
.detail-date{font-size:18px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.detail-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.detail-badge.period{background:var(--danger);color:#fff}
.detail-badge.pred{background:rgba(233,30,105,.15);color:var(--danger);border:1px dashed var(--danger)}
.detail-badge.ovu{background:var(--info);color:#fff}
.detail-badge.fert{background:rgba(168,85,247,.12);color:var(--info)}
.detail-section{margin:10px 0;padding-top:8px;border-top:1px solid var(--border)}
.detail-section h4{font-size:12px;color:#b090a0;margin-bottom:6px}
.detail-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* 经期面板 */
.period-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.period-stat{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}
.period-stat .val{font-size:22px;font-weight:700;color:var(--accent)}
.period-stat .lbl{font-size:10px;color:#b090a0;margin-top:2px}

.cycle-bar-wrap{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:10px 0}
.cycle-period{background:var(--danger)}.cycle-safe{background:var(--success)}.cycle-normal{background:var(--border)}

.prediction-card{background:var(--bg);border-radius:12px;padding:12px;margin:10px 0;border-left:3px solid var(--accent)}
.prediction-card .pred-line{font-size:13px;line-height:1.8}
.prediction-card .pred-disclaimer{font-size:10px;color:#c0a0b0;margin-top:6px;font-style:italic}

/* 消息提示 */
.humane-msg{font-size:13px;color:var(--accent);padding:8px 12px;background:rgba(224,48,108,.06);border-radius:10px;margin:8px 0;line-height:1.6}

/* 症状标签 */
.symptom-tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.symptom-tag{padding:5px 12px;border-radius:14px;font-size:12px;cursor:pointer;transition:.15s;
  background:var(--bg);border:1px solid var(--border);color:var(--text);user-select:none}
.symptom-tag.selected{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 小确幸编辑 */
.joy-edit-area{background:var(--bg);border-radius:12px;padding:14px;margin-top:8px}
.joy-edit-area textarea{margin-bottom:6px;font-size:13px}
.joy-list{margin-top:4px}
.joy-item{font-size:13px;padding:4px 0;display:flex;align-items:center;gap:4px}

/* 提醒设置 */
.reminder-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.reminder-row:last-child{border:none}
.reminder-row label{font-size:13px;cursor:pointer;margin:0}

.toggle-sw{width:44px;height:24px;background:#ddd;border-radius:12px;position:relative;cursor:pointer;transition:.3s}
.toggle-sw.on{background:var(--accent)}
.toggle-sw::after{content:''';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.3s}
.toggle-sw.on::after{left:22px}

.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.history-item:last-child{border:none}
.history-item .hi-dates{font-size:13px}
.history-item .hi-dates .pending{color:var(--gold);font-size:11px}

.tag{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:600}
.tag-today{background:rgba(74,222,128,.15);color:var(--success)}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:var(--radius) var(--radius) 0 0;padding:20px;width:100%;
  max-width:480px;max-height:85vh;overflow-y:auto;animation:slideUp2 .25s ease}
@keyframes slideUp2{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{margin-bottom:12px;font-size:15px}

.level-up-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:300;
  background:linear-gradient(135deg,var(--accent),#f080a0);color:#fff;
  padding:16px 28px;border-radius:16px;font-size:16px;font-weight:800;
  animation:toastIn .4s ease,toastOut .4s 2s ease forwards;pointer-events:none}
@keyframes toastIn{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes toastOut{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-50%) scale(1.2);opacity:0}}

.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:10px;color:#c0a0b0;margin-top:8px;justify-content:center}
.legend span{display:flex;align-items:center;gap:3px}
.legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend .dot.red{background:var(--danger)}
.legend .dot.pink{background:rgba(233,30,105,.35);border:1px dashed var(--danger)}
.legend .dot.purple{background:var(--info)}
.legend .dot.lpurple{background:rgba(168,85,247,.25)}

.flow-selector{display:flex;gap:6px;margin:8px 0}
.flow-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg);
  font-size:16px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.flow-btn.selected{border-color:var(--danger);background:rgba(233,30,105,.1);transform:scale(1.1)}
</style>
</head>
<body>
<div class="app">
<header><h1>🌸 健康生活记录</h1></header>

<div class="panel active" id="panel-calendar">
  <div class="card">
    <div class="cal-header">
      <button onclick="calShift(-1)">◀</button>
      <span class="cal-title" id="calTitle" style="cursor:pointer" onclick="calGoToday()" title="点击回到今天"></span>
      <button onclick="calShift(1)">▶</button>
      <button onclick="calGoToday()" style="font-size:11px;border:1px solid var(--border);padding:4px 10px;border-radius:14px">今天</button>
    </div>
    <div class="cal-grid" id="calDayHeaders"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend">
      <span><span class="dot red"></span> 经期中</span>
      <span><span class="dot pink"></span> 预测经期</span>
      <span><span class="dot purple"></span> 排卵日</span>
      <span><span class="dot lpurple"></span> 易孕期</span>
      <span>🎂 生日</span>
      <span>💊 不适</span>
      <span>⭐ 小确幸</span>
    </div>
  </div>
  <div class="card" id="calInfo"><div style="text-align:center;color:#c0a0b0;font-size:13px">👆 点击日期查看详情 / 记录身体不适 / 写小确幸</div></div>
</div>

<div class="panel" id="panel-birthday">
  <div class="card">
    <h3>🎂 生日提醒</h3>
    <div id="birthdayNext"></div>
    <button class="btn btn-primary btn-block" onclick="showBirthdayForm()" style="margin-top:8px">+ 添加生日</button>
    <div id="birthdayList" style="margin-top:10px"></div>
  </div>
</div>

<div class="panel" id="panel-period">
  <div class="card">
    <h3>🌸 生理期追踪</h3>
    <div class="humane-msg" id="periodHumane"></div>
    <div class="period-stats" id="periodStats"></div>
    <div class="prediction-card" id="predictionCard" style="display:none"></div>
    <div id="periodReminders"></div>
    <button class="btn btn-primary btn-block" onclick="showPeriodForm()" style="margin-top:8px">+ 记录本次月经</button>
    <div id="periodHistory" style="margin-top:12px"></div>
  </div>
</div>
</div>

<nav>
  <button class="active" data-panel="calendar"><span class="icon">📅</span>日历</button>
  <button data-panel="birthday"><span class="icon">🎂</span>生日</button>
  <button data-panel="period"><span class="icon">🌸</span>生理</button>
</nav>
<div id="modalContainer"></div>
<div id="toastContainer"></div>
<script>

function lyDays(y){let s=348,i=0x8000;for(let j=0;j<12;j++){s+=(LUNAR_INFO[y-1900]&i)?1:0;i>>=1}return s+leapDays(y)}
function leapMonth(y){return LUNAR_INFO[y-1900]&0xf}
function leapDays(y){if(leapMonth(y))return(LUNAR_INFO[y-1900]&0x10000)?30:29;return 0}
function monthDays(y,m){return(LUNAR_INFO[y-1900]&(0x10000>>m))?30:29}
function solar2lunar(y,m,d){
  let offset=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
  let ly=1900,t=0;for(;ly<2100&&offset>0;ly++){t=lyDays(ly);offset-=t}
  if(offset<0){offset+=t;ly--}
  let leap=leapMonth(ly),isLeap=false,lm;
  for(lm=1;lm<13&&offset>0;lm++){
    if(leap>0&&lm===leap+1&&!isLeap){--lm;isLeap=true;t=leapDays(ly)}else t=monthDays(ly,lm);
    if(isLeap&&lm===leap+1)isLeap=false;offset-=t;
  }
  if(offset===0&&leap===lm&&isLeap)isLeap=false;
  if(offset<0){offset+=t;lm--}
  return{lyear:ly,lmonth:lm,lday:offset+1,isLeap,lmonthName:(isLeap?"闰":"")+LMON[lm],ldayName:LDAY[offset+1],yearName:GAN[(ly-4)%10]+ZHI[(ly-4)%12],animal:ANIMALS[(ly-4)%12]};
}

function _dk(m,d){return m+"-"+d}

function _todayKey(){let t=new Date();return t.getFullYear()+"-"+(t.getMonth()+1)+"-"+t.getDate()}
function _fmt(d){return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()}
function _el(id){return document.getElementById(id)}
function _dateKey(y,m,d){return y+"-"+m+"-"+d}
function _parseDate(str){let p=str.split("/");if(p.length===3)return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));p=str.split("-");if(p.length===3)return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));return new Date(str)}
function _dateEq(d1,d2){return d1.getFullYear()===d2.getFullYear()&&d1.getMonth()===d2.getMonth()&&d1.getDate()===d2.getDate()}
function _addDays(d,n){let r=new Date(d);r.setDate(r.getDate()+n);return r}
function _daysBetween(d1,d2){return Math.round((d2-d1)/86400000)}

// ==================== Toast ====================
function showToast(msg){
  let el=document.createElement("div");el.className="level-up-toast";el.textContent=msg;
  _el("toastContainer").appendChild(el);setTimeout(function(){el.remove()},2500);
}

// ==================== 数据层 (DB) ====================
const DB={
  _k:"h_",
  get(k,d){try{let v=localStorage.getItem(this._k+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){localStorage.setItem(this._k+k,JSON.stringify(v))},

  _migratePeriods(ps){
    let changed=false;
    ps=ps.map(function(p){
      if(!p.hasOwnProperty("startDate")){
        changed=true;
        let sd=_parseDate(p.start||p.startDate);
        if(isNaN(sd.getTime()))return p;
        let ed=new Date(sd);ed.setDate(ed.getDate()+(p.duration||5)-1);
        return{id:Date.now()+Math.random(),startDate:_fmt(sd),endDate:_fmt(ed),flowLevel:null,cramps:null,symptoms:[],mood:"",notes:"",_migrated:true};
      }
      if(!p.id){changed=true;p.id=Date.now()+Math.random()}
      if(typeof p.symptoms==="string"){changed=true;p.symptoms=p.symptoms?[p.symptoms]:[]}
      return p;
    });
    return ps;
  },
  periods(){let ps=this.get("periods",[]);let migrated=this._migratePeriods(ps);if(migrated!==ps)this.set("periods",migrated);return migrated},
  addPeriod(p){let ps=this.periods();p.id=p.id||Date.now()+Math.random();ps.push(p);ps.sort(function(a,b){return a.startDate<b.startDate?-1:1});this.set("periods",ps);renderPeriod();renderCal()},
  updatePeriod(id,updates){let ps=this.periods();let idx=ps.findIndex(function(p){return p.id===id});if(idx>=0){Object.assign(ps[idx],updates);this.set("periods",ps);renderPeriod();renderCal()}},
  delPeriod(id){let ps=this.periods().filter(function(p){return p.id!==id});this.set("periods",ps);renderPeriod();renderCal()},
  getPeriodById(id){return this.periods().find(function(p){return p.id===id})},

  bdays(){return this.get("bdays",[])},
  addBday(b){let bs=this.bdays();bs.push(b);this.set("bdays",bs);renderBdays();renderCal()},
  updateBday(i,b){let bs=this.bdays();bs[i]=b;this.set("bdays",bs);renderBdays();renderCal()},
  delBday(i){let bs=this.bdays();bs.splice(i,1);this.set("bdays",bs);renderBdays();renderCal()},

  diary(){return this.get("diary",{})},
  saveDiary(d,items){let dd=this.diary();dd[d]=items;this.set("diary",dd)},
  getDiary(d){return(this.diary()||{})[d]||null},

  symptoms(){return this.get("symptoms",{})},
  saveSymptom(date,text){let s=this.symptoms();s[date]=text;this.set("symptoms",s)},
  getSymptom(date){return(this.symptoms()||{})[date]||""},
  delSymptom(date){let s=this.symptoms();delete s[date];this.set("symptoms",s)},

  periodReminders(){return this.get("periodReminders",{beforePeriod:true,ovulation:false,longGap:true})},
  setPeriodReminders(r){this.set("periodReminders",r)}
};

// ==================== 经期预测引擎 ====================
function calculatePrediction(periods){
  if(!periods||periods.length===0)return{confidence:"none",message:"还没有记录过月经，添加记录后可以预测哦 💕"};
  var valid=periods.filter(function(p){return p.startDate});
  valid.sort(function(a,b){return a.startDate<b.startDate?-1:1});
  if(valid.length>6)valid=valid.slice(-6);

  var cycles=[];
  for(var i=1;i<valid.length;i++){
    var d1=_parseDate(valid[i-1].startDate),d2=_parseDate(valid[i].startDate);
    if(isNaN(d1.getTime())||isNaN(d2.getTime()))continue;
    var gap=_daysBetween(d1,d2);
    if(gap>=21&&gap<=45)cycles.push(gap);
  }

  var pLens=[];
  valid.forEach(function(p){
    if(p.endDate){
      var sd=_parseDate(p.startDate),ed=_parseDate(p.endDate);
      if(!isNaN(sd.getTime())&&!isNaN(ed.getTime())){
        var len=_daysBetween(sd,ed)+1;
        if(len>=1&&len<=14)pLens.push(len);
      }
    }
  });

  function median(arr){arr.sort(function(a,b){return a-b});var m=Math.floor(arr.length/2);return arr.length%2?arr[m]:Math.round((arr[m-1]+arr[m])/2)}

  var avgCycle=cycles.length>0?median(cycles):28;
  var avgPeriod=pLens.length>0?median(pLens):5;
  var confidence=cycles.length>=6?"high":(cycles.length>=2?"medium":"low");

  var lastStart=_parseDate(valid[valid.length-1].startDate);
  var nextStart=_addDays(lastStart,avgCycle);
  var nextEnd=_addDays(nextStart,avgPeriod-1);
  var ovDay=_addDays(nextStart,-14);
  var fertileStart=_addDays(ovDay,-5);
  var fertileEnd=_addDays(ovDay,1);

  var today=new Date();today.setHours(0,0,0,0);
  var daysUntil=Math.round((nextStart-today)/86400000);
  var inPeriod=false,periodDay=0;
  valid.forEach(function(p){
    var sd=_parseDate(p.startDate),ed=p.endDate?_parseDate(p.endDate):sd;
    if(!isNaN(sd.getTime())&&!isNaN(ed.getTime())&&sd<=today&&today<=ed){
      inPeriod=true;periodDay=_daysBetween(sd,today)+1;
    }
  });

  var message="";
  if(inPeriod){message="今天是经期第 "+periodDay+" 天，注意休息 💕"}
  else if(daysUntil===0){message="预计今天来月经，做好准备哦 🌸"}
  else if(daysUntil>0&&daysUntil<=7){message="预计还有 "+daysUntil+" 天来月经"}
  else{message="预计 "+_fmt(nextStart)+" 来月经"}
  if(confidence==="low")message+="\n（数据较少，预测仅供参考）";

  return{
    cycleLen:avgCycle,periodLen:avgPeriod,
    nextStart:_fmt(nextStart),nextEnd:_fmt(nextEnd),
    ovDay:_fmt(ovDay),fertileStart:_fmt(fertileStart),fertileEnd:_fmt(fertileEnd),
    confidence:confidence,message:message,
    inPeriod:inPeriod,periodDay:periodDay,daysUntil:daysUntil
  };
}

// ==================== 日历渲染 ====================
var calYear,calMonth;
function initCal(){var n=new Date();calYear=n.getFullYear();calMonth=n.getMonth()+1;renderCal()}
function calShift(d){calMonth+=d;if(calMonth>12){calYear++;calMonth=1}if(calMonth<1){calYear--;calMonth=12}renderCal()}
function calGoToday(){var n=new Date();calYear=n.getFullYear();calMonth=n.getMonth()+1;renderCal()}

function renderCal(){
  var y=calYear,m=calMonth,today=new Date();
  var todayKey=_dateKey(today.getFullYear(),today.getMonth()+1,today.getDate());
  _el("calTitle").textContent=y+"年 "+m+"月";

  var headers=["日","一","二","三","四","五","六"];
  _el("calDayHeaders").innerHTML=headers.map(function(h,i){return '<div class="cal-day-header'+(i===0||i===6?' weekend':'')+'">'+h+'</div>'}).join("");

  var periods=DB.periods();
  var pred=calculatePrediction(periods);

  // 真实经期日期集
  var actualPeriodSet={};
  periods.forEach(function(p){
    var sd=_parseDate(p.startDate);
    if(isNaN(sd.getTime()))return;
    var ed=p.endDate?_parseDate(p.endDate):sd;
    if(isNaN(ed.getTime())){actualPeriodSet[_dateKey(sd.getFullYear(),sd.getMonth()+1,sd.getDate())]=true;return}
    for(var d=new Date(sd);d<=ed;d.setDate(d.getDate()+1)){
      actualPeriodSet[_dateKey(d.getFullYear(),d.getMonth()+1,d.getDate())]=true;
    }
  });

  // 预测经期日期集（排除已真实记录的）
  var predPeriodSet={};
  if(pred.nextStart){
    var ns=_parseDate(pred.nextStart),ne=_parseDate(pred.nextEnd);
    if(!isNaN(ns.getTime())&&!isNaN(ne.getTime())){
      for(var d=new Date(ns);d<=ne;d.setDate(d.getDate()+1)){
        var dk=_dateKey(d.getFullYear(),d.getMonth()+1,d.getDate());
        if(!actualPeriodSet[dk])predPeriodSet[dk]=true;
      }
    }
  }

  // 排卵日 & 易孕期
  var ovSet={},fertileSet={};
  if(pred.ovDay){
    var ov=_parseDate(pred.ovDay);
    if(!isNaN(ov.getTime())){var odk=_dateKey(ov.getFullYear(),ov.getMonth()+1,ov.getDate());if(!actualPeriodSet[odk])ovSet[odk]=true}
  }
  if(pred.fertileStart&&pred.fertileEnd){
    var fs=_parseDate(pred.fertileStart),fe=_parseDate(pred.fertileEnd);
    if(!isNaN(fs.getTime())&&!isNaN(fe.getTime())){
      for(var d=new Date(fs);d<=fe;d.setDate(d.getDate()+1)){
        var dk=_dateKey(d.getFullYear(),d.getMonth()+1,d.getDate());
        if(!actualPeriodSet[dk]&&!ovSet[dk])fertileSet[dk]=true;
      }
    }
  }

  var symptoms=DB.symptoms();
  var diary=DB.diary();
  var bdays=DB.bdays();
  var bdaySet={};
  bdays.forEach(function(b){bdaySet[parseInt(b.month)+"-"+parseInt(b.day)]=b.name});

  var hols={};for(var k in SOLH)hols[k]=SOLH[k];for(var k in LUNH)hols[k]=LUNH[k];

  var firstDay=new Date(y,m-1,1).getDay();
  var daysInMonth=new Date(y,m,0).getDate();
  var grid="";
  for(var i=0;i<firstDay;i++)grid+='<div class="cal-day empty"></div>';
  for(var d=1;d<=daysInMonth;d++){
    var ck=_dateKey(y,m,d);
    var cls=["cal-day"],marks=[];
    var isToday=(ck===todayKey);

    if(actualPeriodSet[ck]){cls.push("period-actual");marks.push("🔴")}
    else if(predPeriodSet[ck]){cls.push("period-pred");marks.push("🩸")}
    if(ovSet[ck]){cls.push("ovulation");marks.push("🥚")}
    else if(fertileSet[ck]){cls.push("fertile");marks.push("💜")}
    if(isToday)cls.push("today");
    var bdKey=m+"-"+d;
    if(bdaySet[bdKey]){cls.push("birthday-day");marks.push("🎂")}
    if(symptoms[ck])marks.push("💊");
    if(diary[ck]&&diary[ck].length>0)marks.push("⭐");
    var hk=_dk(m,d);
    if(hols[hk])cls.push("holiday");

    var lun=solar2lunar(y,m,d);
    var lunarText=lun.ldayName;
    if(lun.lday===1)lunarText=lun.lmonthName;
    if(LUNH[_dk(lun.lmonth,lun.lday)])lunarText=LUNH[_dk(lun.lmonth,lun.lday)]||lunarText;

    grid+='<div class="'+cls.join(" ")+'" onclick="calClick('+y+','+m+','+d+')">';
    grid+='<span class="solar-date">'+d+'</span>';
    grid+='<span class="lunar">'+lunarText+'</span>';
    if(marks.length>0)grid+='<div class="cal-marks">'+marks.map(function(m){return'<span>'+m+'</span>'}).join("")+'</div>';
    grid+='</div>';
  }
  _el("calGrid").innerHTML=grid;
  _el("calTitle").textContent=y+"年 "+m+"月";
}

// ==================== 日历点击详情 ====================
function calClick(y,m,d){
  var dateKey=_dateKey(y,m,d);
  var lun=solar2lunar(y,m,d);
  var today=new Date();today.setHours(0,0,0,0);
  var clickDate=new Date(y,m-1,d);
  var isToday=_dateEq(today,clickDate);
  var periods=DB.periods();
  var pred=calculatePrediction(periods);

  // 查找真实经期记录
  var actualPeriod=null;
  periods.forEach(function(p){
    var sd=_parseDate(p.startDate);
    if(isNaN(sd.getTime()))return;
    var ed=p.endDate?_parseDate(p.endDate):sd;
    if(isNaN(ed.getTime()))ed=sd;
    if(sd<=clickDate&&clickDate<=ed)actualPeriod=p;
  });

  // 预测状态
  var predPeriod=false,ovDay=false,fertileDay=false;
  if(!actualPeriod&&pred.nextStart){
    var ns=_parseDate(pred.nextStart),ne=_parseDate(pred.nextEnd);
    if(!isNaN(ns.getTime())&&!isNaN(ne.getTime())&&ns<=clickDate&&clickDate<=ne)predPeriod=true;
  }
  if(pred.ovDay){var ov=_parseDate(pred.ovDay);if(!isNaN(ov.getTime())&&_dateEq(ov,clickDate))ovDay=true}
  if(!ovDay&&pred.fertileStart&&pred.fertileEnd){
    var fs=_parseDate(pred.fertileStart),fe=_parseDate(pred.fertileEnd);
    if(!isNaN(fs.getTime())&&!isNaN(fe.getTime())&&fs<=clickDate&&clickDate<=fe)fertileDay=true;
  }

  var html='<div class="detail-card">';
  html+='<div class="detail-date">'+y+'年'+m+'月'+d+'日 '+(isToday?'<span class="tag tag-today">今天</span> ':'');
  html+='<span style="font-size:12px;color:#b090a0">'+lun.lmonthName+lun.ldayName+'</span></div>';

  if(actualPeriod){
    var sd=_parseDate(actualPeriod.startDate);
    var pDay=_daysBetween(sd,clickDate)+1;
    html+='<span class="detail-badge period">经期第'+pDay+'天</span> ';
    if(actualPeriod.flowLevel)html+=' 经量: '+'🩸'.repeat(actualPeriod.flowLevel);
    if(actualPeriod.cramps)html+=' 痛经: '+'😣'.repeat(actualPeriod.cramps);
  }else if(predPeriod){html+='<span class="detail-badge pred">🩸 预测经期（仅供参考）</span> '}
  if(ovDay)html+='<span class="detail-badge ovu">🥚 预测排卵日</span> ';
  if(fertileDay)html+='<span class="detail-badge fert">💜 易孕期（仅供参考）</span> ';

  // 症状
  var sym=DB.getSymptom(dateKey);
  if(sym)html+='<div class="detail-section"><h4>💊 身体不适</h4><p style="font-size:13px">'+sym+'</p><button class="btn btn-danger btn-sm" onclick="delSymptom(\''+dateKey+'\')">删除不适记录</button></div>';

  // 小确幸
  var joys=DB.getDiary(dateKey)||[];
  html+='<div class="detail-section"><h4>⭐ 小确幸</h4>';
  if(joys.length>0){
    html+='<div class="joy-list">';
    joys.forEach(function(j,idx){if(j)html+='<div class="joy-item">'+(idx+1)+'. '+j+'</div>'});
    html+='</div>';
    html+='<button class="btn btn-outline btn-sm" style="margin-top:6px" onclick="editDiaryFor(\''+dateKey+'\')">✏️ 修改小确幸</button>';
  }else{
    html+='<p style="font-size:12px;color:#c0a0b0">今天还没记录小确幸</p>';
  }
  html+='<button class="btn btn-outline btn-sm" style="margin-top:4px" onclick="editDiaryFor(\''+dateKey+'\')">+ 添加小确幸</button>';
  html+='</div>';

  // 备注
  if(actualPeriod&&actualPeriod.notes)html+='<div class="detail-section"><h4>📝 备注</h4><p style="font-size:13px">'+actualPeriod.notes+'</p></div>';

  // 快速操作
  html+='<div class="detail-section"><h4>快速操作</h4><div class="detail-actions">';
  if(!actualPeriod){
    html+='<button class="btn btn-primary btn-sm" onclick="quickRecordPeriod(\''+dateKey+'\')">🩸 月经来了</button>';
  }else if(!actualPeriod.endDate){
    html+='<button class="btn btn-success btn-sm" onclick="quickEndPeriod(\''+actualPeriod.id+'\')">✅ 经期结束</button>';
    html+='<button class="btn btn-outline btn-sm" onclick="showEditPeriodForm(\''+actualPeriod.id+'\')">✏️ 修改</button>';
  }else{
    html+='<button class="btn btn-outline btn-sm" onclick="showEditPeriodForm(\''+actualPeriod.id+'\')">✏️ 修改记录</button>';
  }
  html+='<button class="btn btn-outline btn-sm" onclick="showSymptomForm(\''+dateKey+'\')">💊 记录不适</button>';
  html+='</div></div></div>';
  _el("calInfo").innerHTML=html;
}

function quickRecordPeriod(dateKey){
  DB.addPeriod({startDate:dateKey.replace(/-/g,"/"),endDate:null,flowLevel:null,cramps:null,symptoms:[],mood:"",notes:""});
  var parts=dateKey.split("-");
  calClick(parseInt(parts[0]),parseInt(parts[1]),parseInt(parts[2]));
  showToast("已记录月经开始 🌸");
}

function quickEndPeriod(id){
  var today=new Date();today.setHours(0,0,0,0);
  DB.updatePeriod(id,{endDate:_fmt(today)});
  showToast("已记录经期结束 ✅");
}

// ==================== 生日 ====================
function renderBdays(){
  var bdays=DB.bdays(),now=new Date();
  var listHtml="";
  bdays.forEach(function(b,i){
    var ni=calcNextBday(b,now);
    listHtml+='<div class="item-row"><div><strong>'+b.name+'</strong> <span class="tag '+(b.type==="solar"?"tag-solar":"tag-lunar")+'">'+(b.type==="solar"?"国历":"农历")+'</span><br><span style="font-size:11px;color:#b090a0">'+b.month+'月'+b.day+'日';
    if(ni.daysLeft===0)listHtml+=' <span class="tag tag-today">今天!</span>';
    else if(ni.daysLeft<=30)listHtml+=' 还有 '+ni.daysLeft+' 天';
    listHtml+='</span></div><div class="item-actions"><button class="btn btn-outline btn-sm" onclick="editBdayForm('+i+')">✏️</button><button class="btn btn-danger btn-sm" onclick="DB.delBday('+i+')">🗑</button></div></div>';
  });
  _el("birthdayList").innerHTML=listHtml||'<div class="empty-state"><div class="icon">🎂</div>还没有添加生日提醒</div>';

  var upcoming=[];
  bdays.forEach(function(b){
    var ni=calcNextBday(b,now);
    if(ni.daysLeft<=30)upcoming.push({name:b.name,daysLeft:ni.daysLeft,date:ni.date});
  });
  upcoming.sort(function(a,b){return a.daysLeft-b.daysLeft});
  var nextHtml='<h4 style="font-size:12px;color:#b090a0;margin-bottom:6px">📅 最近30天生日提醒</h4>';
  if(upcoming.length===0)nextHtml+='<p style="font-size:12px;color:#c0a0b0">近期没有生日</p>';
  else upcoming.forEach(function(u){nextHtml+='<div style="font-size:13px;padding:4px 0">🎂 '+u.name+' - '+u.date+' ('+(u.daysLeft===0?'今天!':'还有'+u.daysLeft+'天')+')</div>'});
  _el("birthdayNext").innerHTML=nextHtml;
}

function calcNextBday(b,now){
  var bm=parseInt(b.month),bd=parseInt(b.day);
  if(b.type==="solar"){
    var thisYear=new Date(now.getFullYear(),bm-1,bd);
    if(thisYear<now)thisYear.setFullYear(thisYear.getFullYear()+1);
    var daysLeft=Math.ceil((thisYear-now)/86400000);
    return{daysLeft:daysLeft,date:thisYear.getFullYear()+"/"+bm+"/"+bd};
  }else{
    var d=new Date(now);
    for(var i=0;i<400;i++){
      var lun=solar2lunar(d.getFullYear(),d.getMonth()+1,d.getDate());
      if(lun.lmonth===bm&&lun.lday===bd&&!lun.isLeap)return{daysLeft:i,date:_fmt(d)};
      d.setDate(d.getDate()+1);
    }
    return{daysLeft:365,date:"?"};
  }
}

// ==================== 生理期面板 ====================
function renderPeriod(){
  var periods=DB.periods();
  var pred=calculatePrediction(periods);
  var today=new Date();today.setHours(0,0,0,0);

  var humaneHtml="";
  if(!periods||periods.length===0){
    humaneHtml="🌸 欢迎使用生理期记录！<br>点击下方按钮记录你的第一次月经，系统会在记录 2-3 次后开始智能预测。";
  }else{
    humaneHtml=pred.message.replace(/\n/g,"<br>");
    var unended=periods.filter(function(p){return !p.endDate});
    if(unended.length>0)humaneHtml+='<br><span style="color:var(--gold)">💡 这次经期结束了吗？可以补充记录哦</span>';
    if(pred.daysUntil<0&&!pred.inPeriod&&periods.length>=2)humaneHtml+='<br><span style="color:var(--gold)">⚠️ 本次经期比预测推迟了 '+Math.abs(pred.daysUntil)+' 天，要记录一下吗？</span>';
  }
  _el("periodHumane").innerHTML=humaneHtml;

  // 统计
  var statsHtml='';
  statsHtml+='<div class="period-stat"><div class="val">'+periods.length+'</div><div class="lbl">📋 记录次数</div></div>';
  statsHtml+='<div class="period-stat"><div class="val">'+pred.cycleLen+'</div><div class="lbl">📅 平均周期(天)</div></div>';
  statsHtml+='<div class="period-stat"><div class="val">'+pred.periodLen+'</div><div class="lbl">🩸 平均经期(天)</div></div>';
  _el("periodStats").innerHTML=statsHtml;

  if(periods.length>0){
    var predHtml='<h4 style="font-size:12px;color:#b090a0">📊 预测详情</h4><div class="pred-line">';
    predHtml+='🩸 预计下次: <strong>'+pred.nextStart+' ~ '+pred.nextEnd+'</strong><br>';
    predHtml+='🥚 排卵日: <strong>'+pred.ovDay+'</strong><br>';
    predHtml+='💜 易孕期: '+pred.fertileStart+' ~ '+pred.fertileEnd+'<br></div>';
    predHtml+='<div class="pred-disclaimer">';
    if(pred.confidence==="low")predHtml+='⚠️ 数据较少（少于2次有效记录），预测仅供参考';
    else if(pred.confidence==="medium")predHtml+='📊 基于 '+periods.length+' 次记录预测（置信度：中）';
    else predHtml+='✅ 基于近6次记录预测（置信度：高）';
    predHtml+='</div>';
    _el("predictionCard").style.display="block";
    _el("predictionCard").innerHTML=predHtml;
  }else{_el("predictionCard").style.display="none"}

  // 提醒
  var reminders=DB.periodReminders();
  var remHtml='<h4 style="font-size:12px;color:#b090a0;margin-top:10px">🔔 提醒设置</h4>';
  remHtml+='<div class="reminder-row"><label>经期开始前提醒</label><div class="toggle-sw'+(reminders.beforePeriod?' on':'')+'" onclick="toggleReminder(\'beforePeriod\')"></div></div>';
  remHtml+='<div class="reminder-row"><label>排卵期提醒</label><div class="toggle-sw'+(reminders.ovulation?' on':'')+'" onclick="toggleReminder(\'ovulation\')"></div></div>';
  remHtml+='<div class="reminder-row"><label>长时间未记录提醒</label><div class="toggle-sw'+(reminders.longGap?' on':'')+'" onclick="toggleReminder(\'longGap\')"></div></div>';
  _el("periodReminders").innerHTML=remHtml;

  // 历史
  var histHtml='<h4 style="font-size:12px;color:#b090a0;margin-top:4px;margin-bottom:6px">📜 历史记录</h4>';
  if(periods.length===0)histHtml+='<p style="font-size:12px;color:#c0a0b0">还没有记录</p>';
  else{
    periods.slice().reverse().forEach(function(p){
      histHtml+='<div class="history-item"><div class="hi-dates">'+p.startDate;
      if(p.endDate)histHtml+=' ~ '+p.endDate;
      else histHtml+=' <span class="pending">待补结束日</span>';
      if(p.flowLevel)histHtml+=' '+'🩸'.repeat(p.flowLevel);
      if(p.cramps)histHtml+=' '+'😣'.repeat(p.cramps);
      if(p.symptoms&&p.symptoms.length>0)histHtml+='<br><span style="font-size:10px;color:#c0a0b0">'+p.symptoms.join('、')+'</span>';
      histHtml+='</div><div class="item-actions">';
      if(!p.endDate)histHtml+='<button class="btn btn-success btn-sm" onclick="showEndPeriodForm(\''+p.id+'\')">补录</button>';
      histHtml+='<button class="btn btn-outline btn-sm" onclick="showEditPeriodForm(\''+p.id+'\')">✏️</button>';
      histHtml+='<button class="btn btn-danger btn-sm" onclick="delPeriodConfirm(\''+p.id+'\')">🗑</button>';
      histHtml+='</div></div>';
    });
  }
  _el("periodHistory").innerHTML=histHtml;
}

function toggleReminder(key){
  var r=DB.periodReminders();r[key]=!r[key];DB.setPeriodReminders(r);renderPeriod();
}

function setFlow(n){_el("pflowVal").value=n;_el("modalContainer").querySelectorAll(".flow-btn").forEach(function(b,i){b.classList.toggle("selected",i+1===n)})}

function savePeriod(){
  var start=_el("pstart").value,end=_el("pend").value;
  if(!start)return showToast("请选择开始日期");
  var startFmt=start.replace(/-/g,"/"),endFmt=end?end.replace(/-/g,"/"):null;
  if(endFmt&&_parseDate(endFmt)<_parseDate(startFmt))return showToast("结束日期不能早于开始日期");
  var flow=_el("pflowVal").value?parseInt(_el("pflowVal").value):null;
  var cramps=_el("pcramps").value?parseInt(_el("pcramps").value):null;
  var symptomEls=_el("modalContainer").querySelectorAll(".symptom-tag.selected");
  var symptoms=[];symptomEls.forEach(function(s){symptoms.push(s.textContent)});
  var notes=_el("pnotes").value.trim();
  DB.addPeriod({startDate:startFmt,endDate:endFmt,flowLevel:flow,cramps:cramps,symptoms:symptoms,mood:"",notes:notes});
  closeModal();showToast("已记录月经 🌸");
}

function showEndPeriodForm(id){

function saveEndPeriod(id){
  var end=_el("pendDate").value;if(!end)return;

  DB.updatePeriod(id,{endDate:end.replace(/-/g,"/")});
  closeModal();showToast("已补充结束日期 ✅");
}

  html+='<div class="form-group"><label>症状</label><div class="symptom-tags" id="symptomTags">';
  ["头痛","腰酸","乳房胀痛","疲劳","情绪波动","腹胀","失眠","食欲变化","长痘","便秘","腹泻","怕冷"].forEach(function(t){html+='<span class="symptom-tag'+((p.symptoms||[]).indexOf(t)>=0?' selected':'')+'" onclick="this.classList.toggle(\'selected\')">'+t+'</span>'});
  html+='</div></div>';

  html+='<button class="btn btn-primary btn-block" onclick="saveEditPeriod(\''+id+'\')">保存修改</button>';

function saveEditPeriod(id){
  var start=_el("pstart").value,end=_el("pend").value;
  if(!start)return showToast("请选择开始日期");
  var startFmt=start.replace(/-/g,"/"),endFmt=end?end.replace(/-/g,"/"):null;
  if(endFmt&&_parseDate(endFmt)<_parseDate(startFmt))return showToast("结束日期不能早于开始日期");
  var symptomEls=_el("modalContainer").querySelectorAll(".symptom-tag.selected");
  var symptoms=[];symptomEls.forEach(function(s){symptoms.push(s.textContent)});
  DB.updatePeriod(id,{startDate:startFmt,endDate:endFmt,flowLevel:_el("pflowVal").value?parseInt(_el("pflowVal").value):null,cramps:_el("pcramps").value?parseInt(_el("pcramps").value):null,symptoms:symptoms,notes:_el("pnotes").value.trim()});
  closeModal();showToast("记录已更新 ✅");
}

function delPeriodConfirm(id){

// ==================== 导航 ====================
function switchPanel(name){
  document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active")});
  document.querySelectorAll("nav button").forEach(function(b){b.classList.remove("active")});
  var panel=_el("panel-"+name);if(panel)panel.classList.add("active");
  var btn=document.querySelector('nav button[data-panel="'+name+'"]');if(btn)btn.classList.add("active");
  if(name==="calendar")renderCal();
  else if(name==="birthday")renderBdays();
  else if(name==="period")renderPeriod();
}
document.querySelectorAll("nav button").forEach(function(b){b.addEventListener("click",function(){switchPanel(b.dataset.panel)})});

function init(){initCal();renderBdays();renderPeriod()}
init();
